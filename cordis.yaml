# Development overlay for a source checkout of the harness:
#   pnpm dsh web --patch dsh-plugin-ui-font-family/cordis.yaml --port 3082
#
# `insert` adds the row to the composition. `name` is resolved relative to this
# file's directory (packages/boot/app-boot/src/index.ts, anchorInsertedPluginNames),
# so the checkout can move without an edit here. Pointing at src/index.ts requires
# dsh to run sources through tsx; a built or installed package uses its name or
# './lib/index.js' instead.
- insert:
    - id: ui-font-family
      name: './src/index.ts'
      # Deployment-varying values belong in config; every field is optional.
      #
      # config:
      #   # Uploaded fonts; defaults to <harness home>/fonts.
      #   fontDir: /srv/dsh/fonts
      #   # Overrides the harness home; defaults to $DSH_HOME, then ~/.dsh.
      #   dshHome: /srv/dsh
      #   # Extra directories to scan, after the platform's own.
      #   systemFontDirs:
      #     - /opt/fonts
      #   # Scans the platform directories; defaults to true.
      #   scanSystemFonts: true
      #   # Largest accepted upload in bytes; defaults to 20971520 (20 MiB).
      #   maxUploadBytes: 20971520
      #   # Font used until a user chooses one; "restore default" returns here.
      #   defaultFamily:
      #     source: preset
      #     id: sans
